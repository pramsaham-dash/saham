<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Dashboard Saham Indonesia</title>
<style>
:root{color-scheme:dark;--bg:#121211;--card:#1a1a19;--bd:#34342f;--tx:#fff;--mu:#8d8c83;--ac:#3987e5;--er:#d03b3b}
@media (prefers-color-scheme: light){:root{color-scheme:light;--bg:#f4f4f1;--card:#fcfcfb;--bd:#dddcd6;--tx:#0b0b0b;--mu:#7a7973;--ac:#2a78d6}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mu);font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--ac);outline-offset:0}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--mu)}
button{width:100%;margin-top:18px;font:inherit;font-weight:600;color:#fff;background:var(--ac);border:0;border-radius:10px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--er);font-size:13px;min-height:20px;margin-top:10px}
.pw{position:relative}.pw span{position:absolute;right:10px;top:9px;cursor:pointer;color:var(--mu);font-size:13px;user-select:none}
</style></head>
<body>
<form class="box" id="f" autocomplete="on">
  <h1>📈 Dashboard Saham Indonesia</h1>
  <p>Silakan masuk untuk membuka dashboard.</p>
  <label for="u">Username</label><input id="u" type="text" autocomplete="username" required autofocus>
  <label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><span id="eye">lihat</span></div>
  <label class="row"><input type="checkbox" id="rem" checked> Tetap masuk selama tab ini terbuka</label>
  <button id="b" type="submit">Masuk</button>
  <div class="err" id="e"></div>
</form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(user,pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));
  return new TextDecoder().decode(pt);
}
function open_(html){ document.open(); document.write(html); document.close(); }
const $=id=>document.getElementById(id);
$('eye').onclick=()=>{ const p=$('p'); p.type=p.type==='password'?'text':'password'; $('eye').textContent=p.type==='password'?'lihat':'sembunyi'; };
if(!window.crypto || !crypto.subtle){ $('e').textContent='Browser ini tidak mendukung pembukaan file terkunci. Gunakan Chrome, Edge atau Firefox versi terbaru.'; $('b').disabled=true; }
(async()=>{ try{ const s=sessionStorage.getItem('dsh_auth'); if(s){ const [u,p]=JSON.parse(s); open_(await unlock(u,p)); } }catch(e){ try{sessionStorage.removeItem('dsh_auth');}catch(_){} } })();
$('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); $('e').textContent=''; $('b').disabled=true; $('b').textContent='Memeriksa…';
  const u=$('u').value, p=$('p').value;
  try{ const html=await unlock(u,p);
       try{ if($('rem').checked) sessionStorage.setItem('dsh_auth',JSON.stringify([u,p])); }catch(_){}
       open_(html);
  }catch(e){ $('e').textContent='Username atau password salah.'; $('b').disabled=false; $('b').textContent='Masuk'; $('p').select(); }
});
})();
