<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pusat Dashboard Saham</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-50:#f0f8ff;
    --blue-100:#e0f0ff;
    --blue-200:#bfe0ff;
    --blue-300:#8ecbff;
    --blue-400:#4fb0ff;
    --blue-500:#1e90ff;
    --blue-600:#0b72e0;
    --ink:#0f2a44;
    --muted:#5b7390;
    --white:#ffffff;
    --shadow:0 8px 22px -10px rgba(30,144,255,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--blue-50),var(--blue-100));
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ========== NAVBAR ATAS ========== */
  .navbar{
    flex-shrink:0;
    height:62px;
    display:flex;align-items:center;gap:18px;
    padding:0 16px;
    background:var(--white);
    border-bottom:1px solid var(--blue-100);
    box-shadow:0 4px 16px -10px rgba(30,144,255,.35);
    position:relative;z-index:10;
  }
  .navbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg,var(--blue-300),var(--blue-500),var(--blue-300));
  }

  .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .brand-logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--blue-400),var(--blue-600));
    display:grid;place-items:center;box-shadow:var(--shadow);
  }
  .brand-logo svg{width:21px;height:21px}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
  .brand span{font-size:11px;color:var(--muted);font-weight:500}

  .tabs{
    display:flex;gap:6px;
    padding:5px;border-radius:14px;
    background:var(--blue-50);
    border:1px solid var(--blue-100);
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:flex;align-items:center;gap:8px;
    padding:8px 16px;border-radius:10px;
    border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);
    white-space:nowrap;transition:all .22s ease;
  }
  .tab svg{width:18px;height:18px;flex-shrink:0}
  .tab:hover{color:var(--blue-600);background:var(--white)}
  .tab.active{
    color:var(--white);
    background:linear-gradient(135deg,var(--blue-400),var(--blue-600));
    box-shadow:var(--shadow);
  }

  .right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .status{
    display:flex;align-items:center;gap:10px;
    padding:6px 12px;border-radius:11px;
    background:var(--blue-50);border:1px solid var(--blue-100);
  }
  .clock{font-size:14px;font-weight:800;color:var(--blue-600);letter-spacing:-.2px}
  .market{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .market.open{color:#059669}
  .market.open .dot{background:#10b981;animation:pulse 1.6s infinite}
  .market.closed{color:var(--muted)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  .actions{display:flex;gap:6px}
  .btn{
    width:36px;height:36px;border-radius:10px;cursor:pointer;
    border:1px solid var(--blue-200);background:var(--white);color:var(--blue-600);
    display:grid;place-items:center;transition:all .2s ease;
  }
  .btn:hover{background:var(--blue-500);color:var(--white);border-color:var(--blue-500);box-shadow:var(--shadow)}
  .btn svg{width:17px;height:17px}

  /* ========== AREA IFRAME ========== */
  .stage{flex:1;min-height:0;padding:8px;display:flex}
  .frame-wrap{
    flex:1;position:relative;overflow:hidden;
    border-radius:14px;background:var(--white);
    border:1px solid var(--blue-100);
    box-shadow:0 14px 34px -22px rgba(30,144,255,.5);
  }
  iframe{width:100%;height:100%;border:0;display:block;background:var(--white)}

  .loader{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--white);transition:opacity .35s ease;
  }
  .loader.hide{opacity:0;pointer-events:none}
  .spinner{
    width:48px;height:48px;border-radius:50%;
    border:5px solid var(--blue-100);border-top-color:var(--blue-500);
    animation:spin .9s linear infinite;
  }
  .loader p{font-size:13.5px;color:var(--muted);font-weight:600}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ========== RESPONSIVE ========== */
  @media (max-width:1000px){
    .brand-text,.status{display:none}
  }
  @media (max-width:640px){
    .navbar{gap:10px;padding:0 10px;height:56px}
    .tab{padding:7px 11px;font-size:12.5px}
    .tab .long{display:none}
    .btn.hide-sm{display:none}
    .stage{padding:6px}
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
    </div>
    <div class="brand-text">
      <h1>Saham Hub</h1>
      <span>Pusat pantauan pasar IDX</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-src="Radar-Saham-IDX.html" data-title="Radar Saham IDX">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/><line x1="12" y1="12" x2="18.5" y2="5.5"/></svg>
      Radar<span class="long">&nbsp;Saham IDX</span>
    </button>
    <button class="tab" data-src="Dashboard-Saham-Indonesia.html" data-title="Dashboard Saham Indonesia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard<span class="long">&nbsp;Saham Indonesia</span>
    </button>
  </div>

  <div class="right">
    <div class="status">
      <span class="clock" id="clock">--:--</span>
      <span class="market closed" id="market"><span class="dot"></span><span id="marketTxt">Bursa Tutup</span></span>
    </div>
    <div class="actions">
      <button class="btn" id="reload" title="Muat ulang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
      </button>
      <button class="btn hide-sm" id="newtab" title="Buka di tab baru">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </button>
      <button class="btn" id="fullscreen" title="Layar penuh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="stage">
  <section class="frame-wrap" id="frameWrap">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Memuat dashboard…</p>
    </div>
    <iframe id="viewer" src="Radar-Saham-IDX.html" title="Dashboard"></iframe>
  </section>
</main>

<script>
  const viewer = document.getElementById('viewer');
  const loader = document.getElementById('loader');
  const tabs   = document.querySelectorAll('.tab');

  const showLoader = () => loader.classList.remove('hide');
  viewer.addEventListener('load', () => loader.classList.add('hide'));

  function openPage(btn){
    tabs.forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.title = btn.dataset.title + ' · Saham Hub';
    showLoader();
    viewer.src = btn.dataset.src;
    try { localStorage.setItem('lastDashboard', btn.dataset.src); } catch(e){}
  }
  tabs.forEach(btn => btn.addEventListener('click', () => openPage(btn)));

  // buka menu terakhir yang dipakai
  try {
    const last = localStorage.getItem('lastDashboard');
    const match = [...tabs].find(t => t.dataset.src === last);
    if (match && !match.classList.contains('active')) openPage(match);
  } catch(e){}

  document.getElementById('reload').onclick = () => { showLoader(); viewer.src = viewer.getAttribute('src'); };
  document.getElementById('newtab').onclick = () => window.open(viewer.getAttribute('src'), '_blank');
  document.getElementById('fullscreen').onclick = () => {
    const el = document.getElementById('frameWrap');
    if (!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.();
  };

  // jam & status bursa (WIB)
  function tick(){
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta' }));
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss} WIB`;

    const d = now.getDay(), m = now.getHours()*60 + now.getMinutes();
    const isFri = d === 5;
    const sesi1 = m >= 540 && m < (isFri ? 690 : 720);   // 09:00 – 12:00 (Jumat 11:30)
    const sesi2 = m >= (isFri ? 840 : 810) && m < 950;    // 13:30 – 15:50 (Jumat 14:00)
    const open = d >= 1 && d <= 5 && (sesi1 || sesi2);
    document.getElementById('market').className = 'market ' + (open ? 'open' : 'closed');
    document.getElementById('marketTxt').textContent = open ? 'Bursa Buka' : 'Bursa Tutup';
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
